[project]
name = "proofread"
version = "0.1.0"
description = "Self-improving coding agent harness with formal and empirical promotion gates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "jsonpatch>=1.33",
  "python-dotenv>=1.0",
  "datasets>=2.19",
  "matplotlib>=3.8",
  "cryptography>=42",
  "pymongo>=4.18.2",
]

[project.scripts]
proofread = "proofread.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofread"]

[tool.pytest.ini_options]
testpaths = ["tests", "baselines/tests"]
asyncio_mode = "auto"
markers = [
  "docker: needs docker",
  "biject: needs the local biject-api",
  "slow: long running",
  "network: needs external network",
]
